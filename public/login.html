<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="manifest" href="/manifest.json">

    <title>Login | Atelier Emily Calixto</title>

    <link rel="stylesheet" href="styles.css">


    <link
        href="https://fonts.googleapis.com/css2?family=Allura&family=Sunflower:wght@300;500;700&family=Poppins:wght@300;400;500&display=swap"
        rel="stylesheet">

</head>


<body>


    <main class="login">


        <div class="login-card">


            <span>
                Atelier Emily Calixto
            </span>


            <h1>
                Área da Artista
            </h1>


            <p>
                Digite sua senha para acessar o painel de obras.
            </p>



            <div class="campo-login">

                <input type="password" id="senha" placeholder="Senha">

                <p id="erroLogin">
                    Senha incorreta.
                </p>

            </div>



            <button id="btnEntrar">
                Entrar
            </button>



        </div>


    </main>



    <script src="/login.js"></script>


</body>

</html>
